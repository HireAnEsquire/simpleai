[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haesimpleai"
version = "0.14"
description = "Unified prompt runner across major generative AI providers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Hire an Esquire" }
]
keywords = ["ai", "llm", "django", "openai", "anthropic", "gemini", "grok", "perplexity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: Django",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.13.4,<3.0.0",
  "openai>=2.38.0,<3.0.0",
  "anthropic>=0.104.0,<1.0.0",
  "google-genai>=2.6.0,<3.0.0",
  "google-cloud-storage>=3.10.0,<4.0.0",
  "xai-sdk>=1.12.2,<2.0.0",
  "perplexityai>=0.34.0,<1.0.0",
  "pypdf>=6.12.2,<7.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "striprtf>=0.0.32,<1.0.0",
  "tenacity>=9.1.4,<10.0.0",
]

[project.scripts]
simpleai-provider-smoke = "simpleai.scripts.run_provider_smoke:main"
simpleai-reasoning-smoke = "simpleai.scripts.reasoning_smoke:main"

[project.optional-dependencies]
django = ["Django>=4.2"]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "Django>=4.2",
]

[project.urls]
Homepage = "https://github.com/HireAnEsquire/simpleai"
Repository = "https://github.com/HireAnEsquire/simpleai"
Issues = "https://github.com/HireAnEsquire/simpleai/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["simpleai*"]

[tool.setuptools.package-data]
simpleai = [
  "py.typed",
  "settings_examples/*.json",
  "settings_examples/*.py",
  "samples/*.pdf",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "Django>=4.2",
]
